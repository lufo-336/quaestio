name: Deploy WebAssembly to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Pin .NET 10 SDK
        # Dal 14/11/2026 il runner ha anche l'SDK .NET 11: senza global.json vince
        # quello, il workload wasm-tools diventa 11.0.100 e SkiaSharp non viene
        # ricollegato (sito nero, crash su SKImageInfo). Solo in CI, non nel repo.
        run: |
          dotnet new globaljson --sdk-version 10.0.100 --roll-forward latestFeature --force
          dotnet --version

      - name: Install wasm-tools
        run: dotnet workload install wasm-tools

      - name: Publish WebAssembly
        run: dotnet publish wsa.quiz.browser/Wsa.Quiz.Browser.csproj -c Release -o release

      - name: Ensure .nojekyll
        run: touch release/wwwroot/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: release/wwwroot

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
